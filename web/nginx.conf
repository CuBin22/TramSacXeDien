server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://app:8080/api/; proxy_set_header Authorization $http_authorization; proxy_set_header Host $host; }
  location /actuator/ { proxy_pass http://app:8080/actuator/; }
  location / { try_files $uri $uri/ /index.html; }
}
